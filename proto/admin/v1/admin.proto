syntax = "proto3";

package admin.v1;

service AdminService {
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse) {}
}

message GetOverviewRequest {
  string admin_secret = 1;
}

message PersonSummary {
  int64 id = 1;
  string username = 2;
  bool is_guest = 3;
  string created_at = 4;
}

message GetOverviewResponse {
  int64 total_persons = 1;
  int64 guest_persons = 2;
  repeated PersonSummary recent_persons = 3;
}
